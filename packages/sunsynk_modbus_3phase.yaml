# ── WHAT TO LOOK FOR IN THE RESULTS ─────────────────────────
#
#  Sensor              Expected raw value     Look for
#  ──────────────────  ─────────────────────  ──────────────────────────────
#  Grid Voltage L1     ~2300 (×0.1 = 230V)   Find which reg has ~2300
#  Grid Voltage L2     ~2300                  Should be next reg after L1
#  Grid Voltage L3     ~2300                  Should be next reg after L2
#  Battery Voltage     ~5200 (×0.01 = 52V)   Find which reg has ~5000–5800
#  Battery SOC         1–100 directly         Find which reg has your SOC %
#  Battery Temp        ~1250 (25°C)           (raw-1000)×0.1 = 25°C
#  Battery Power       signed watts           Should match inverter display
#  Load Power L1       signed watts (~200W?)  Currently showing 10922 raw
#  Grid Frequency      ~5000 (×0.01 = 50Hz)  Find reg with 5000
#
# Once you identify which address holds which value, compare
# to the main YAML and correct any offsets.
# ─────────────────────────────────────────────────────────────
