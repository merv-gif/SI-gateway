  - platform: modbus_controller            # Serial (raw internal, reg 3 same)
    modbus_controller_id: ${modbus_controller_id}
    id: ${id_prefix}esphome_serial
    register_type: holding
    address: 3
    register_count: 5
    raw_encode: HEXBYTES
    internal: true
    skip_updates: ${settings_skipped_updates}

  - platform: template
    name: "${name_prefix}Serial"
    id: ${id_prefix}esphome_ascii_serial
    icon: "mdi:text"
    entity_category: diagnostic
    lambda: |-
      std::string hexData = id(${id_prefix}esphome_serial).state;
      if (hexData.empty()) return {"unknown"};
      std::string asciiData;
      for (size_t i = 0; i < hexData.length(); i += 2) {
        std::string byte = hexData.substr(i, 2);
        char chr = static_cast<char>(std::stoi(byte, nullptr, 16));
        asciiData.push_back(chr);
      }
      return {asciiData};

################################################ SELECT SENSORS #######################################
select:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    id: ${id_prefix}esphome_select_energy_pattern
    name: "${name_prefix}Energy Pattern"
    address: 243
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Battery first": 0
      "Load first": 1

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    id: ${id_prefix}esphome_select_work_mode
    name: "${name_prefix}Work Mode"
    address: 244
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Selling First": 0
      "Zero Export + Limit to Load Only": 1
      "Limited to Home": 2

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    id: ${id_prefix}esphome_select_generator_input
    name: "${name_prefix}Generator Input"
    address: 235
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Disable": 0
      "Output": 1
      "Input": 2

  - platform: modbus_controller            # 500 Grid Peak Shaving (3PH: register 500)
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Grid Peak Shaving"
    id: ${id_prefix}esphome_select_grid_peak_shaving
    address: 500
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Disabled": 0
      "Enabled": 256
    lambda: |-
      if (!id(${id_prefix}grid_peak_shaving_raw).has_state()) return {};
      if ((x & 0x0100) == 0) return std::string("Disabled");
      if ((x & 0x0100) == 256) return std::string("Enabled");
      return {};
    write_lambda: |-
      uint16_t unmodified = id(${id_prefix}grid_peak_shaving_raw).state;
      uint16_t modified = ((unmodified & ~0x0100) | value);
      return modified;

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Prog1 Charge Option"
    id: ${id_prefix}esphome_select_system_mode_charge_option_time_1
    address: 274
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "No Grid or Gen": 0
      "Allow Grid": 1
      "Allow Gen": 2
      "Allow Grid & Gen": 3
    lambda: |-
      if (!id(${id_prefix}reg_274_raw).has_state()) return {};
      switch (x & 0x0003) {
        case 0: return std::string("No Grid or Gen");
        case 1: return std::string("Allow Grid");
        case 2: return std::string("Allow Gen");
        case 3: return std::string("Allow Grid & Gen");
      }
      return {};
    write_lambda: |-
      uint16_t raw = id(${id_prefix}reg_274_raw).state;
      return ((raw & ~0x0003) | value);

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Prog2 Charge Option"
    id: ${id_prefix}esphome_select_system_mode_charge_option_time_2
    address: 275
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "No Grid or Gen": 0
      "Allow Grid": 1
      "Allow Gen": 2
      "Allow Grid & Gen": 3
    lambda: |-
      if (!id(${id_prefix}reg_275_raw).has_state()) return {};
      switch (x & 0x0003) {
        case 0: return std::string("No Grid or Gen");
        case 1: return std::string("Allow Grid");
        case 2: return std::string("Allow Gen");
        case 3: return std::string("Allow Grid & Gen");
      }
      return {};
    write_lambda: |-
      uint16_t raw = id(${id_prefix}reg_275_raw).state;
      return ((raw & ~0x0003) | value);

