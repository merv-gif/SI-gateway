# ============================================================
# DIAGNOSTIC YAML — Raw register dump for address verification
# Flash this alongside (or instead of) the main sensors file.
# All sensors are INTERNAL so they don't flood HA entities,
# but they WILL appear in ESPHome logs so you can read them.
#
# HOW TO USE:
#   1. Flash this to the ESP device
#   2. Open ESPHome logs
#   3. Compare raw values to expected real-world values
#   4. Use the table below to verify correct addresses
#
# WHAT WE ARE HUNTING:
#   - Voltage L1/L2/L3 showing 1200V  → raw 12000, should be ~2300 for 230V
#   - Current L1/L2/L3 showing 54.1A  → raw 5410, all identical = wrong address
#   - Load Power L1 = 10922W, L2 = -1W → clearly offset
#   - Battery registers all returning 0 or 0xFFFF
# ============================================================

sensor:

# ── VOLTAGE BLOCK SCAN (addresses 148–162) ──────────────────
# Expected: ~2300 raw for 230V (×0.1 filter)
# If your inverter is 48V battery: battery voltage ~5000 raw

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "RAW reg 148"
    id: ${id_prefix}raw_148
    register_type: holding
    address: 148
    value_type: U_WORD
    internal: false
    entity_category: diagnostic

