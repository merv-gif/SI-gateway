  - platform: template
    name: "${name_prefix}Serial"
    id: ${id_prefix}esphome_ascii_serial
    icon: "mdi:text"
    entity_category: diagnostic
    lambda: |-
      std::string hexData = id(${id_prefix}esphome_serial).state;
      if (hexData.empty()) return {"unknown"};
      std::string asciiData;
      for (size_t i = 0; i < hexData.length(); i += 2) {
        std::string byte = hexData.substr(i, 2);
        char chr = static_cast<char>(std::stoi(byte, nullptr, 16));
        asciiData.push_back(chr);
      }
      return {asciiData};

############################################### SETTINGS — MOVED ###################################
# The read-only text-sensor mirrors that used to live here are GONE:
#   ProgN Charge Option  -> now real `select` entities at 172-177 (see below)
#   Energy Pattern (243) -> register does not exist on this machine
#   Work Mode      (244) -> register does not exist on this machine
#   Generator Input (235)-> register does not exist on this machine
# Keeping the text sensors alongside the selects would have published TWO
# entities named "ProgN Charge Option", and MQTT object ids come from the NAME
# — they would have collided on the wire.


############################################### WRITABLE SETTINGS ###################################
# Everything below writes to the inverter. Addresses measured on a live machine
# 4 Sep 2026 — see the header. Nothing here is inherited from the 1p map.

############################################### SLOT WORD CACHE #####################################
# 172-177 need read-modify-write, which means knowing the current word.
#
# DO NOT go back to `internal: true` modbus sensors for this. That is exactly
# what broke Battery Boost on 11 Aug 2026: the guard read inverter_reg_27x_raw,
# those sensors never populate in practice, and the button could never pass its
# own check. The fix there was to read from the SELECT — entities that are
# proven to carry values. Same principle here, one step further: the select's
# publish lambda stashes the raw word it was just handed, and the write path
# reads that. 0xFFFF means "not polled yet" and blocks any write.
globals:
  - id: ${id_prefix}slot_opt_1
    type: uint16_t
    restore_value: no
    initial_value: '0xFFFF'
  - id: ${id_prefix}slot_opt_2
    type: uint16_t
    restore_value: no
    initial_value: '0xFFFF'
  - id: ${id_prefix}slot_opt_3
    type: uint16_t
    restore_value: no
    initial_value: '0xFFFF'
  - id: ${id_prefix}slot_opt_4
    type: uint16_t
    restore_value: no
    initial_value: '0xFFFF'
  - id: ${id_prefix}slot_opt_5
    type: uint16_t
    restore_value: no
    initial_value: '0xFFFF'
  - id: ${id_prefix}slot_opt_6
    type: uint16_t
    restore_value: no
    initial_value: '0xFFFF'

number:
  - platform: modbus_controller            # 125 Grid Charge Amps
    # NOT 210 (what the read-only map guessed, reads 0 here) and NOT the 1p
    # map's 230 (0xFFFF on this machine). 125 identified by Merv from the
    # inverter's own charge tab, pending a watch-mode confirmation.
    #
    # The inverter keeps grid and gen adjacent everywhere: bit0 grid / bit1 gen
    # in the slot words at 172-177, and 125 grid amps / 128 gen amps here.
    #
    # 🛑 126 IS A VOLTAGE SETTING. Do not add it to this map, do not write it.
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Grid Charge Battery current"
    id: ${id_prefix}esphome_grid_charge_bat_current
