################################################ TEXT SENSORS #########################################
  # ============================================================
  # SI AGGREGATES  (added for ECM / app compatibility)
  # Mirror the single-phase package ids + names 1:1 so the ECM
  # (SI Surplus Scale) lambda and the SI app work UNCHANGED.
  # ============================================================
  - platform: template                     # Whole-site load = L1+L2+L3
    name: "${name_prefix}Load Power"
    id: ${id_prefix}esphome_load_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: |-
      float a = id(${id_prefix}esphome_load_power_l1).state;
      float b = id(${id_prefix}esphome_load_power_l2).state;
      float c = id(${id_prefix}esphome_load_power_l3).state;
      if (isnan(a)) a = 0; if (isnan(b)) b = 0; if (isnan(c)) c = 0;
      return a + b + c;

  - platform: template                     # Whole-site grid power = L1+L2+L3 (feeds app grid gauge)
    name: "${name_prefix}Grid Power"
    id: ${id_prefix}esphome_grid_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: |-
      float a = id(${id_prefix}esphome_grid_power_l1).state;
      float b = id(${id_prefix}esphome_grid_power_l2).state;
      float c = id(${id_prefix}esphome_grid_power_l3).state;
      if (isnan(a)) a = 0; if (isnan(b)) b = 0; if (isnan(c)) c = 0;
      return a + b + c;

  - platform: template                     # Signed battery power (+ = discharge, matches 1-phase reg 190)
    name: "${name_prefix}Battery Power"
    id: ${id_prefix}esphome_battery_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: |-
      float dis = id(${id_prefix}battery_discharge_power).state;
      float chg = id(${id_prefix}battery_charge_power).state;
      if (isnan(dis)) dis = 0; if (isnan(chg)) chg = 0;
      return dis - chg;

  - platform: template                     # Grid voltage = reg 600, gated on grid-connected relay (552) for true Eskom-down
    name: "${name_prefix}Grid Voltage"
    id: ${id_prefix}esphome_grid_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    update_interval: 5s
    lambda: |-
      // Deye 3-phase reports a single grid voltage (reg 600). Gate on the grid
      // relay (reg 552) so a real Eskom-down reads 0V instead of a stale voltage.
      bool connected = id(${id_prefix}esphome_grid_connected_status).state;
      if (!connected) return 0.0f;
      float v = id(${id_prefix}esphome_grid_voltage_l1).state;
      if (isnan(v)) return NAN;
      return v;

