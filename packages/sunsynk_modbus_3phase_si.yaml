# ============================================================================
# SUNSYNK / DEYE 3-PHASE (LOW VOLTAGE) — SI REGISTER MAP
# ============================================================================
# Provenance: this is solaire-esphome/packages/sunsynk_modbus_3phase_fixed.yaml
# — the map running on the Trivella gateway (client 3cbaac) — with EVERY
# WRITE ENTITY REMOVED. The read side is byte-for-byte the field-proven map;
# nothing was re-derived.
#
# WRITES ENABLED 4 Sep 2026 — AT MEASURED ADDRESSES
#   This map shipped read-only because the 3-phase write addresses had never
#   been confirmed on a live machine. They now have been, on Grant Levin's
#   inverter (client a31cd1), by diffing register snapshots against changes
#   made on the inverter's OWN FRONT PANEL — never by writing and hoping.
#   Full method and evidence: solaire-esphome/3P-REGISTER-FINDINGS.md
#
#   WHAT THE OLD MAP GOT WRONG. The four toggles were believed to be packed
#   into register 248 with bitmasks 1/2/4/8. On this machine 248 does not
#   exist — 241-267 is a dead block that reads 0xFFFF stable. Neither do 243
#   (Energy Pattern) or 244 (Work Mode). And the slot charge options are not
#   at 274-279: that is part of a 42-register run (268-309) that all reads
#   1000. Every one of those addresses was inherited from the single-phase
#   map and never checked.
#
#   WHERE THEY ACTUALLY ARE, each confirmed by a panel change moving exactly
#   one register, and confirmed again in the reverse direction:
#     141           Priority Load        plain 0/1
#     145           Solar Sell           plain 0/1
#     146 bit0      System Timer (TOU)   bitfield, reads 0xFF with timer on
#     148-153       Prog 1-6 Time        (read; the old header said 250-255)
#     166-171       Prog 1-6 Capacity    target SOC %
#     172-177       Prog 1-6 Charge Opt  bit0 grid charge, bit1 gen charge
#
#   STILL UNVERIFIED: that any of these ACCEPT A WRITE. Every change during
#   mapping was made on the panel. Reading a setting is not the same as
#   writing it — the panel may enforce validation the register does not.
#   First fleet push must be verified by read-back before it is trusted.
#
#   READ-MODIFY-WRITE IS MANDATORY on 146 and 172-177. 146 reads 0xFF and only
#   bit0 is understood; 172-177 carry two independent flags. Writing a bare
#   value clears bits that belong to the customer's configuration. Every write
#   entity below preserves the rest of the word.
#
# THE ONE WRITE THAT REMAINS: the hourly RTC sync (registers 22-24). It has
# been running on the Trivella unit against this exact map for months, and an
# inverter with a wrong clock runs its TOU program at the wrong times. Delete
# the interval + script below if you want a build that cannot write at all.
#
# Consumed by: solaire-esphome targets/si-gateway-node-3p.yaml
#              (build si-gateway-3p-stock) via products/gateway.yaml.
# Battery Boost is NOT composed into that build — see products/gateway_boost.yaml.
# ============================================================================

substitutions:
  settings_skipped_updates: "10"

# ============================================================
# CORRECTED REGISTER MAP — Sunsynk/Deye 3-Phase (Low Voltage)
# Source: kellerza/sunsynk definitions3ph.py + klatremis/esphome-for-deye
#
# KEY DIFFERENCES FROM SINGLE-PHASE:
#   Grid Voltage L1/L2/L3  → 598, 599, 600   (not 150/151/152)
#   Grid Current L1/L2/L3  → 604, 605, 606   (not 160/161/162)
#   Grid Power L1/L2/L3    → 601, 602, 603   (not 167/168/169)
#   Inverter Voltage L1/L2/L3 → 636,637,638  (not 154/155/156)
#   Inverter Current L1/L2/L3 → 639,640,641  (not 164/165/166)
#   Inverter Power L1/L2/L3   → 633,634,635  (not 175/176/177)
#   Load Power L1/L2/L3    → 650, 651, 652   (not 178/179/180)
#   Load Total Power        → 653             (not template)
#   Grid CT Total Power     → 625             (not 172)
#   Battery Power           → 590             (not 190)
#   Battery Voltage         → 587             (not 183)
#   Battery SOC             → 588             (not 184)
#   Battery Current         → 591             (not 191)
#   Battery Temperature     → 586             (not 182)
#   PV1 Power               → 672             (not 186)
#   PV2 Power               → 673             (not 187)
#   PV1 Voltage             → 676             (not 109)
#   PV2 Voltage             → 678             (not 111)
#   PV1 Current             → 677             (not 110)
#   PV2 Current             → 679             (not 112)
#   Grid Frequency          → 608             (not 79)
#   Inverter Frequency      → 644             (not 193)
#   Load Frequency          → 643             (not 192)
#   Overall State           → 500             (not 59)
#   Grid Connected Status   → 194             (same)
#   Day PV Energy           → 108             (same)
#   Day Battery Charge      → 70              (same)
#   Day Battery Discharge   → 71              (same)
#   Day Grid Import         → 76              (same)
#   Day Grid Export         → 77              (same)
#   Day Load Energy         → 84              (same)
#   DC Transformer Temp     → 90              (same)
#   Radiator Temperature    → 91              (same)
#   Time slots (250–255)    →                 (same)
#   Settings (243–249)      →                 (same)
# ============================================================

interval:
  - interval: 3600s
    then:
      - if:
          condition:
            time.has_time:
          then:
            - script.execute: ${id_prefix}sync_time

script:
  - id: ${id_prefix}sync_time
    then:
      - lambda: |-
          esphome::modbus_controller::ModbusController *controller = id(${modbus_controller_id});
          time_t now = ::time(nullptr);
          struct tm *time_info = ::localtime(&now);
          int seconds = time_info->tm_sec;
          int minutes = time_info->tm_min;
          int hour = time_info->tm_hour;
          int day = time_info->tm_mday;
          int month = time_info->tm_mon + 1;
          int year = time_info->tm_year + 1900;
          int year1 = year - 2000;
          uint16_t reg22_value = (year1 << 8) | month;
          uint16_t reg23_value = (day << 8) | hour;
          uint16_t reg24_value = (minutes << 8) | seconds;
          if (year != 1970) {
            std::vector<uint16_t> rtc_data = {reg22_value, reg23_value, reg24_value};
            esphome::modbus_controller::ModbusCommandItem set_rtc_command =
                esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(controller, 22, rtc_data.size(), rtc_data);
            controller->queue_command(set_rtc_command);
            ESP_LOGI("Time Sync", "Sec:%d Min:%d Hr:%d Day:%d Mon:%d Year:%d", seconds, minutes, hour, day, month, year);
          }

############################################### BINARY SENSORS ########################################
binary_sensor:
  - platform: modbus_controller            # 194 Grid Connected Status (same as 1-phase)
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Grid Connected Status"
    id: ${id_prefix}esphome_grid_connected_status
    register_type: holding
    address: 552
    force_new_range: true

  - platform: modbus_controller           # 500 Gen Peak Shaving Status (3PH: register 500 bitmask)
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Gen Peak Shaving Status"
    id: ${id_prefix}esphome_gen_peak_shaving_status
    register_type: holding
    address: 500
    force_new_range: true
    bitmask: 0x10

  - platform: modbus_controller           # 500 Grid Peak Shaving Status
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Grid Peak Shaving Status"
    id: ${id_prefix}esphome_grid_peak_shaving_status
    register_type: holding
    address: 500
    force_new_range: true
    bitmask: 0x100

############################################### SETTINGS ############################################
# The four toggles are NOT packed into 248 on this machine — see the header.
# They are switches now, each at its measured address, further down this file.

############################################### BATTERY ###############################################
sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Battery Temperature"
    id: ${id_prefix}esphome_battery_temperature
    register_type: holding
    address: 586
    force_new_range: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    value_type: S_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Battery Voltage"
    id: ${id_prefix}esphome_battery_voltage
    register_type: holding
    address: 587
    force_new_range: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Battery SOC"
    id: ${id_prefix}esphome_battery_soc
    register_type: holding
    address: 588
    force_new_range: true
    unit_of_measurement: "%"
    device_class: battery
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Battery Current"
    id: ${id_prefix}esphome_battery_current
    register_type: holding
    address: 591
    force_new_range: true
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    value_type: S_WORD
    filters:
      - multiply: 0.01

  # Split power (correct approach)
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Battery Charge Power"
    id: ${id_prefix}battery_charge_power
    register_type: holding
    address: 590
    force_new_range: true
    unit_of_measurement: "W"
    device_class: power
    value_type: S_WORD
    lambda: |-
      if (x < 0) return -x;
      return 0;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Battery Discharge Power"
    id: ${id_prefix}battery_discharge_power
    register_type: holding
    address: 590
    force_new_range: true
    unit_of_measurement: "W"
    device_class: power
    value_type: S_WORD
    lambda: |-
      if (x > 0) return x;
      return 0;

