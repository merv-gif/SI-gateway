select:
  - platform: modbus_controller            # 172 Prog1 Charge Option — bit0 grid, bit1 gen
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Prog1 Charge Option"
    id: ${id_prefix}esphome_select_charge_option_time_1
    address: 172
    value_type: U_WORD
    use_write_multiple: true
    force_new_range: true
    skip_updates: ${settings_skipped_updates}
    entity_category: config
    optionsmap:
      "No Grid or Gen": 0
      "Allow Grid": 1
      "Allow Gen": 2
      "Allow Grid & Gen": 3
    lambda: |-
      // Stash the word we were just handed. This lambda runs on every poll and
      // x IS the raw register — no separate sensor, nothing that can fail to
      // populate. This is the only thing that feeds the write path.
      id(${id_prefix}slot_opt_1) = (uint16_t) x;
      switch (x & 0x0003) {
        case 0: return std::string("No Grid or Gen");
        case 1: return std::string("Allow Grid");
        case 2: return std::string("Allow Gen");
        case 3: return std::string("Allow Grid & Gen");
      }
      return {};
    write_lambda: |-
      // Read-modify-write. Only bits 0-1 are ours; the rest of the word belongs
      // to the customer's configuration and must survive untouched.
      uint16_t raw = id(${id_prefix}slot_opt_1);
      if (raw == 0xFFFF) return {};   // never polled — refuse rather than guess
      return ((raw & ~0x0003) | value);

