switch:
  - platform: modbus_controller            # 145 Solar Sell — plain 0/1, NOT 248 bit3
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Toggle Solar Sell"
    id: ${id_prefix}toggle_solar_sell
    address: 145
    register_type: holding
    use_write_multiple: true
    force_new_range: true
    skip_updates: ${settings_skipped_updates}
    entity_category: config

  - platform: modbus_controller            # 146 bit0 System Timer (TOU) — NOT 248 bit2
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Toggle System Timer"
    id: ${id_prefix}toggle_system_timer
    address: 146
    register_type: holding
    bitmask: 0x0001
    use_write_multiple: true
    force_new_range: true
    skip_updates: ${settings_skipped_updates}
    entity_category: config
    # 146 reads 0xFF with the timer on and 0xFE with it off. Seven other bits
    # are set and NOT identified — six slots plus one spare is the obvious
    # guess and it is only a guess. bitmask makes ESPHome read-modify-write,
    # which is the only reason touching this register is safe.

  - platform: modbus_controller            # 141 Priority Load — plain 0/1, NOT 248 bit1
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Toggle Priority Load"
    id: ${id_prefix}toggle_priority_load
    address: 141
    register_type: holding
    use_write_multiple: true
    force_new_range: true
    skip_updates: ${settings_skipped_updates}
    entity_category: config

  # ── Global Grid Charge ────────────────────────────────────────────────────
  # There is no global grid-charge register on this machine: grid charge is
  # bit0 of each slot word, six of them. The app has one switch, so this drives
  # all six. ON only when EVERY slot has bit0 set — a half-on state would lie.
  # One tap writes up to six registers, each read-modify-write so gen charge
  # (bit1) survives.
  - platform: template
    name: "${name_prefix}Toggle Grid Charge"
    id: ${id_prefix}toggle_grid_charge
    optimistic: false
    entity_category: config
    lambda: |-
      // ON only when EVERY polled slot has bit0. Unknown until at least one
      // slot has been polled — see the SLOT WORD CACHE note above.
      bool all_on = true, any_known = false;
      const uint16_t w[6] = { id(${id_prefix}slot_opt_1), id(${id_prefix}slot_opt_2),
                              id(${id_prefix}slot_opt_3), id(${id_prefix}slot_opt_4),
                              id(${id_prefix}slot_opt_5), id(${id_prefix}slot_opt_6) };
      for (int i = 0; i < 6; i++) {
        if (w[i] == 0xFFFF) continue;
        any_known = true;
        if ((w[i] & 0x0001) == 0) all_on = false;
      }
      if (!any_known) return {};
      return all_on;
    turn_on_action:
      - lambda: |-
          // No global grid-charge register exists here: it is bit0 of each slot
          // word. Read-modify-write every slot so gen charge (bit1) survives.
          // Same pattern as the RTC sync script above — proven on this bus.
          esphome::modbus_controller::ModbusController *ctrl = id(${modbus_controller_id});
          uint16_t w[6] = { id(${id_prefix}slot_opt_1), id(${id_prefix}slot_opt_2),
                            id(${id_prefix}slot_opt_3), id(${id_prefix}slot_opt_4),
                            id(${id_prefix}slot_opt_5), id(${id_prefix}slot_opt_6) };
          const uint16_t regs[6] = {172, 173, 174, 175, 176, 177};
          for (int i = 0; i < 6; i++) {
            if (w[i] == 0xFFFF) continue;   // not polled yet — never guess
            uint16_t cur = w[i];
            uint16_t next = (uint16_t)(cur | 0x0001);
            if (next == cur) continue;   // never write a word that is already right
            ctrl->queue_command(
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                ctrl, regs[i], next));
            ESP_LOGI("si_3p", "grid charge ON: reg %u %u -> %u", regs[i], cur, next);
          }
      - switch.template.publish:
          id: ${id_prefix}toggle_grid_charge
          state: true
    turn_off_action:
      - lambda: |-
          // No global grid-charge register exists here: it is bit0 of each slot
          // word. Read-modify-write every slot so gen charge (bit1) survives.
          // Same pattern as the RTC sync script above — proven on this bus.
          esphome::modbus_controller::ModbusController *ctrl = id(${modbus_controller_id});
          uint16_t w[6] = { id(${id_prefix}slot_opt_1), id(${id_prefix}slot_opt_2),
                            id(${id_prefix}slot_opt_3), id(${id_prefix}slot_opt_4),
                            id(${id_prefix}slot_opt_5), id(${id_prefix}slot_opt_6) };
          const uint16_t regs[6] = {172, 173, 174, 175, 176, 177};
          for (int i = 0; i < 6; i++) {
            if (w[i] == 0xFFFF) continue;   // not polled yet — never guess
            uint16_t cur = w[i];
            uint16_t next = (uint16_t)(cur & ~0x0001);
            if (next == cur) continue;   // never write a word that is already right
            ctrl->queue_command(
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                ctrl, regs[i], next));
            ESP_LOGI("si_3p", "grid charge OFF: reg %u %u -> %u", regs[i], cur, next);
          }
      - switch.template.publish:
          id: ${id_prefix}toggle_grid_charge
          state: false

