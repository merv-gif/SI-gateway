################################################ TEXT SENSORS #########################################
  # ============================================================
  # SI AGGREGATES  (added for ECM / app compatibility)
  # Mirror the single-phase package ids + names 1:1 so the ECM
  # (SI Surplus Scale) lambda and the SI app work UNCHANGED.
  # ============================================================
  - platform: template                     # Whole-site load = L1+L2+L3
    name: "${name_prefix}Load Power"
    id: ${id_prefix}esphome_load_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: |-
      float a = id(${id_prefix}esphome_load_power_l1).state;
      float b = id(${id_prefix}esphome_load_power_l2).state;
      float c = id(${id_prefix}esphome_load_power_l3).state;
      if (isnan(a)) a = 0; if (isnan(b)) b = 0; if (isnan(c)) c = 0;
      return a + b + c;

  - platform: template                     # Whole-site grid power = L1+L2+L3 (feeds app grid gauge)
    name: "${name_prefix}Grid Power"
    id: ${id_prefix}esphome_grid_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: |-
      float a = id(${id_prefix}esphome_grid_power_l1).state;
      float b = id(${id_prefix}esphome_grid_power_l2).state;
      float c = id(${id_prefix}esphome_grid_power_l3).state;
      if (isnan(a)) a = 0; if (isnan(b)) b = 0; if (isnan(c)) c = 0;
      return a + b + c;

  - platform: template                     # Signed battery power (+ = discharge, matches 1-phase reg 190)
    name: "${name_prefix}Battery Power"
    id: ${id_prefix}esphome_battery_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: |-
      float dis = id(${id_prefix}battery_discharge_power).state;
      float chg = id(${id_prefix}battery_charge_power).state;
      if (isnan(dis)) dis = 0; if (isnan(chg)) chg = 0;
      return dis - chg;

  - platform: template                     # Grid voltage = reg 600, gated on grid-connected relay (552) for true Eskom-down
    name: "${name_prefix}Grid Voltage"
    id: ${id_prefix}esphome_grid_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    update_interval: 5s
    lambda: |-
      // Deye 3-phase reports a single grid voltage (reg 600). Gate on the grid
      // relay (reg 552) so a real Eskom-down reads 0V instead of a stale voltage.
      bool connected = id(${id_prefix}esphome_grid_connected_status).state;
      if (!connected) return 0.0f;
      float v = id(${id_prefix}esphome_grid_voltage_l1).state;
      if (isnan(v)) return NAN;
      return v;

############################################### SETTINGS ############################################
# Slot target SOC moved to `number:` (writable) at the bottom of this file.
# Ids match the single-phase map so anything reading them (the app, HA, the
# dashboards) sees the same entity on either phase.

  # ── Raws behind the writable slot selects ────────────────────────────────
  # A select cannot read-modify-write without knowing the current word. These
  # are internal: the customer-facing entity is the select, not the number.

text_sensor:
  - platform: modbus_controller            # 500 Overall State (3PH uses 500, not 59)
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Overall State"
    id: ${id_prefix}esphome_overall_state
    register_type: holding
    address: 500
    force_new_range: true
    raw_encode: HEXBYTES
    entity_category: diagnostic
    skip_updates: ${settings_skipped_updates}
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("standby");
        case 1: return std::string("selftest");
        case 2: return std::string("normal");
        case 3: return std::string("alarm");
        case 4: return std::string("fault");
        default: return std::string("unknown");
      }

  - platform: template
    name: "${name_prefix}Time Slot 1"
    id: ${id_prefix}esphome_time_slot_1
    icon: "mdi:clock"
    entity_category: diagnostic
    lambda: |-
      if (!id(${id_prefix}esphome_system_mode_time1).has_state()) return {"--:--"};
      int raw = (int) id(${id_prefix}esphome_system_mode_time1).state;
      if (raw == 65535 || raw < 0) return {"--:--"};
      int hours = raw / 100;
      int minutes = raw % 100;
      if (hours > 23 || minutes > 59) return {"--:--"};
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", hours, minutes);
      return {buf};

