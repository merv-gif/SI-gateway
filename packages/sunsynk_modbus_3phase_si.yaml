    modbus_controller_id: ${modbus_controller_id}
    id: ${id_prefix}esphome_serial
    register_type: holding
    address: 3
    register_count: 5
    raw_encode: HEXBYTES
    internal: true
    skip_updates: ${settings_skipped_updates}

  - platform: template
    name: "${name_prefix}Serial"
    id: ${id_prefix}esphome_ascii_serial
    icon: "mdi:text"
    entity_category: diagnostic
    lambda: |-
      std::string hexData = id(${id_prefix}esphome_serial).state;
      if (hexData.empty()) return {"unknown"};
      std::string asciiData;
      for (size_t i = 0; i < hexData.length(); i += 2) {
        std::string byte = hexData.substr(i, 2);
        char chr = static_cast<char>(std::stoi(byte, nullptr, 16));
        asciiData.push_back(chr);
      }
      return {asciiData};

############################################### SETTINGS — READ-ONLY ##################################
# The single-phase map exposes these as SELECTs. Here they are text sensors:
# same names, same option strings, no way to write a wrong value to a
# three-phase inverter before the addresses are confirmed.
  - platform: template                     # 274 Prog1 Charge Option (read-only)
    name: "${name_prefix}Prog1 Charge Option"
    id: ${id_prefix}esphome_select_system_mode_charge_option_time_1
    icon: "mdi:transmission-tower"
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      if (!id(${id_prefix}reg_274_raw).has_state()) return {};
      switch (((uint16_t) id(${id_prefix}reg_274_raw).state) & 0x0003) {
        case 0: return {"No Grid or Gen"};
        case 1: return {"Allow Grid"};
        case 2: return {"Allow Gen"};
        case 3: return {"Allow Grid & Gen"};
      }
      return {};
