text_sensor:
  - platform: modbus_controller            # 500 Overall State (3PH uses 500, not 59)
    modbus_controller_id: ${modbus_controller_id}
    name: "${name_prefix}Overall State"
    id: ${id_prefix}esphome_overall_state
    register_type: holding
    address: 500
    force_new_range: true
    raw_encode: HEXBYTES
    entity_category: diagnostic
    skip_updates: ${settings_skipped_updates}
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("standby");
        case 1: return std::string("selftest");
        case 2: return std::string("normal");
        case 3: return std::string("alarm");
        case 4: return std::string("fault");
        default: return std::string("unknown");
      }

  - platform: template
    name: "${name_prefix}Time Slot 1"
    id: ${id_prefix}esphome_time_slot_1
    icon: "mdi:clock"
    entity_category: diagnostic
    lambda: |-
      if (!id(${id_prefix}esphome_system_mode_time1).has_state()) return {"--:--"};
      int raw = (int) id(${id_prefix}esphome_system_mode_time1).state;
      if (raw == 65535 || raw < 0) return {"--:--"};
      int hours = raw / 100;
      int minutes = raw % 100;
      if (hours > 23 || minutes > 59) return {"--:--"};
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", hours, minutes);
      return {buf};

  - platform: template
    name: "${name_prefix}Time Slot 2"
    id: ${id_prefix}esphome_time_slot_2
    icon: "mdi:clock"
    entity_category: diagnostic
    lambda: |-
      if (!id(${id_prefix}esphome_system_mode_time2).has_state()) return {"--:--"};
      int raw = (int) id(${id_prefix}esphome_system_mode_time2).state;
      if (raw == 65535 || raw < 0) return {"--:--"};
      int hours = raw / 100;
      int minutes = raw % 100;
      if (hours > 23 || minutes > 59) return {"--:--"};
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", hours, minutes);
      return {buf};

