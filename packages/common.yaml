substitutions:

  public: false
  logger_level: INFO

logger:
  level: ${logger_level}

api:

ota:
  platform: esphome
  on_begin:
    then:
      - script.execute: ota_blink

time:
  - platform: sntp
    id: sntp_

wifi:
  ap:

  on_connect:
    then:
      - script.stop: wifi_blink
      - light.turn_on: status_led

  on_disconnect:
    then:
      - script.execute: wifi_blink

web_server:
  port: 80

captive_portal:

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic
    bssid:
      name: "BSSID"
      entity_category: diagnostic

sensor:
  - platform: uptime
    name: "Uptime"
    device_class: duration
    disabled_by_default: true
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    disabled_by_default: true
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Reboot to Safe Mode"
    entity_category: config


# -----------------------------
# SI Gateway Status LED
# -----------------------------

output:
  - platform: gpio
    pin: GPIO4
    id: status_led_output

light:
  - platform: binary
    output: status_led_output
    id: status_led
    internal: true


# -----------------------------
# LED behaviour scripts
# -----------------------------

script:

  # Slow blink while WiFi not connected
  - id: wifi_blink
    mode: restart
    then:
      - repeat:
          while:
            not:
              wifi.connected:
          then:
            - light.toggle: status_led
            - delay: 800ms

  # Fast blink during OTA
  - id: ota_blink
    mode: restart
    then:
      - repeat:
          count: 200
          then:
            - light.toggle: status_led
            - delay: 150ms


# Start blinking on boot until WiFi connects
esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: wifi_blink
